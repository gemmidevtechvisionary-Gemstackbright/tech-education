<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>មេរៀនទី ៦ - ការបង្កើត Forms</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>មេរៀនទី ៦៖ ការប្រើប្រាស់ Forms (ទម្រង់បែបបទ)</h1>
    <p>Forms ត្រូវបានប្រើប្រាស់សម្រាប់ប្រមូលទិន្នន័យពីអ្នកប្រើប្រាស់ ដូចជាការចុះឈ្មោះ ឬចូលគណនីជាដើម។</p>

    <form action="#" method="POST">
        <label for="username">ឈ្មោះអ្នកប្រើប្រាស់៖</label><br>
        <input type="text" id="username" name="username" placeholder="បញ្ចូលឈ្មោះរបស់អ្នក"><br><br>

        <label for="email">អ៊ីម៉ែល (Email)៖</label><br>
        <input type="email" id="email" name="email" placeholder="example@gmail.com"><br><br>

        <label for="password">ពាក្យសម្ងាត់៖</label><br>
        <input type="password" id="password" name="password"><br><br>

        <button type="submit">ចុះឈ្មោះ</button>
    </form>

    <br>
    <a href="lesson5.html">មេរៀនមុន</a> | <a href="lessons.html">ត្រឡប់ទៅទំព័រដើម</a>
</body>
</html>
